
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Apartment - Apartments</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <i class="fas fa-building"></i>
        Smart Apartment
      </div>
      <ul class="nav flex-column mt-3">
        <li class="nav-item">
          <a class="nav-link" href="dashboard.html">
            <i class="fas fa-home"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="apartments.html">
            <i class="fas fa-building"></i>Apartments
          </a>
        </li>
        <li class="nav-item admin-only">
          <a class="nav-link" href="users.html">
            <i class="fas fa-users"></i>Users
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="bills.html">
            <i class="fas fa-file-invoice-dollar"></i>Bills
          </a>
        </li>
        <li class="nav-item security-only">
          <a class="nav-link" href="visitors.html">
            <i class="fas fa-user-friends"></i>Visitors
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="service-requests.html">
            <i class="fas fa-tools"></i>Service Requests
          </a>
        </li>
        <li class="nav-item mt-3">
          <a class="nav-link" href="#" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i>Logout
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
      <nav class="top-navbar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <button
            class="btn btn-link text-dark me-3 d-lg-none"
            id="sidebarToggle"
          >
            <i class="fas fa-bars fa-lg"></i>
          </button>
          <span class="navbar-brand mb-0 h4">Apartments</span>
        </div>
        <div class="d-flex align-items-center">
          <div class="user-info d-flex align-items-center">
            <div class="user-avatar me-2" id="userAvatar">A</div>
            <div>
              <div class="fw-semibold" id="userName">Admin</div>
              <small class="text-muted" id="userRole">Admin</small>
            </div>
          </div>
        </div>
      </nav>

      <div class="container-fluid p-4">
        <!-- Page Header -->
        <div
          class="page-header d-flex justify-content-between align-items-center"
        >
          <h4><i class="fas fa-building me-2"></i>Manage Apartments</h4>
          <button
            class="btn btn-primary admin-only"
            data-bs-toggle="modal"
            data-bs-target="#apartmentModal"
          >
            <i class="fas fa-plus me-2"></i>Add Apartment
          </button>
        </div>

        <!-- Filters -->
        <div class="filter-section">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Status</label>
              <select class="form-select" id="filterStatus">
                <option value="">All Status</option>
                <option value="vacant">Vacant</option>
                <option value="occupied">Occupied</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Floor</label>
              <select class="form-select" id="filterFloor">
                <option value="">All Floors</option>
                <option value="1">Floor 1</option>
                <option value="2">Floor 2</option>
              </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <button
                class="btn btn-secondary w-100"
                onclick="loadApartments()"
              >
                <i class="fas fa-filter me-2"></i>Apply Filters
              </button>
            </div>
          </div>
        </div>

        <!-- Apartments Table -->
        <div class="table-container">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Unit #</th>
                  <th>Floor</th>
                  <th>Bedrooms</th>
                  <th>Bathrooms</th>
                  <th>Area (sqft)</th>
                  <th>Rent ($)</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="apartmentsTable">
                <tr>
                  <td colspan="8" class="text-center text-muted py-4">
                    Loading apartments...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Add/Edit Apartment Modal -->
    <div class="modal fade" id="apartmentModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="apartmentModalTitle">
              <i class="fas fa-plus-circle me-2"></i>Add Apartment
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="apartmentForm">
            <div class="modal-body">
              <input type="hidden" id="apartmentId" />
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Unit Number</label>
                  <input
                    type="text"
                    class="form-control"
                    id="unitNumber"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Floor</label>
                  <input
                    type="number"
                    class="form-control"
                    id="floor"
                    min="1"
                    required
                  />
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Bedrooms</label>
                  <input
                    type="number"
                    class="form-control"
                    id="bedrooms"
                    min="1"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Bathrooms</label>
                  <input
                    type="number"
                    class="form-control"
                    id="bathrooms"
                    min="1"
                    required
                  />
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Area (sqft)</label>
                  <input
                    type="number"
                    class="form-control"
                    id="areaSqft"
                    step="0.01"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Rent Amount ($)</label>
                  <input
                    type="number"
                    class="form-control"
                    id="rentAmount"
                    step="0.01"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="apartmentStatus">
                  <option value="vacant">Vacant</option>
                  <option value="occupied">Occupied</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea
                  class="form-control"
                  id="description"
                  rows="3"
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i>Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- View Details Modal -->
    <div class="modal fade" id="viewApartmentModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fas fa-info-circle me-2"></i>Apartment Details
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="apartmentDetails">
            <!-- Details will be loaded here -->
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
    <script src="js/apartments.js"></script>
  </body>
</html>
